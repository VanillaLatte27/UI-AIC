version: "3.9"

services:
  backend:
    volumes:
      - ./AI:/app
    environment:
      - FLASK_DEBUG=true
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5001
      - FLASK_APP=flask_app_combined:app
      - AIC_FPS=20
      - AIC_JPEG_QUALITY=80
      - AIC_RESIZE_WIDTH=640
      - AIC_IMGSZ=640
      - AIC_TORCH_THREADS=4
      - AIC_OPENCV_THREADS=2
      - AIC_DEVICE=
    command: flask run --host=0.0.0.0 --port=5001 --debug

  frontend:
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_FLASK_BASE_URL=http://localhost:5001
      - FLASK_API_URL=http://localhost:5001
    volumes:
      - ./front-end/ui-aic:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

  cloudflared:
    profiles: ["prod"]
