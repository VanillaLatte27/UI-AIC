version: "3.9"

services:
  backend:
    volumes:
      - ./AI:/app
    environment:
      - FLASK_DEBUG=true
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5001
      - FLASK_APP=flask_app_combined:app
      - AIC_FPS=10
      - AIC_JPEG_QUALITY=70
      - AIC_RESIZE_WIDTH=480
      - AIC_IMGSZ=320
      - AIC_TORCH_THREADS=6
      - AIC_OPENCV_THREADS=1
      - AIC_DEVICE=
    command: python flask_app_combined.py

  frontend:
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_FLASK_BASE_URL=http://localhost:5001
      - FLASK_API_URL=http://localhost:5001
    volumes:
      - ./front-end/ui-aic:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

  cloudflared:
    profiles: ["prod"]
